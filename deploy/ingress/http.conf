# Managed by wuye domain ingress. Bootstrap HTTP; enable HTTPS after certificate issuance.
server {
    listen 80;
    server_name h5.jiaanfuwu.cn wx.jiaanfuwu.cn admin.jiaanfuwu.cn;
    access_log off;
    error_log /var/log/nginx/wuye-ingress-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wuye-ingress/acme;
        try_files $uri =404;
    }
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wuye-ingress/verify;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Domain setup in progress.\n";
    }
}
