# Managed by wuye domain ingress. Requires the wuye-ingress certificate.
server {
    listen 80;
    server_name h5.jiaanfuwu.cn wx.jiaanfuwu.cn admin.jiaanfuwu.cn;
    access_log off;
    error_log /var/log/nginx/wuye-ingress-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wuye-ingress/acme;
        try_files $uri =404;
    }
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wuye-ingress/verify;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name h5.jiaanfuwu.cn;
    ssl_certificate /etc/letsencrypt/live/wuye-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuye-ingress/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/wuye-ingress-error.log crit;
    client_max_body_size 256k;
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wuye-ingress/verify;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host h5.jiaanfuwu.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host h5.jiaanfuwu.cn;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /_wuye_unavailable.html;
    }
    location = /_wuye_unavailable.html {
        internal;
        root /var/www/wuye-ingress;
    }
}

server {
    listen 443 ssl;
    server_name wx.jiaanfuwu.cn;
    ssl_certificate /etc/letsencrypt/live/wuye-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuye-ingress/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/wuye-ingress-error.log crit;
    client_max_body_size 256k;

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wuye-ingress/verify;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /wechat/callback {
        proxy_pass http://127.0.0.1:18080/wechat-test/callback;
        proxy_set_header Host h5.jiaanfuwu.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host h5.jiaanfuwu.cn;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}

# The management site is deliberately unavailable on the public ingress.
server {
    listen 443 ssl;
    server_name admin.jiaanfuwu.cn;
    ssl_certificate /etc/letsencrypt/live/wuye-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuye-ingress/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/wuye-ingress-error.log crit;
    location / { return 403; }
}
